<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Eight Pages</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="hub-nav.css">
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:Georgia,'Times New Roman',serif;color:#ddd;user-select:none}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#box{position:relative;width:min(100vw,177.78vh);height:min(56.25vw,100vh);overflow:hidden;background:#000}
#st,#vg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#st{image-rendering:pixelated;mix-blend-mode:screen;opacity:0}
#vg{background:radial-gradient(ellipse at center,transparent 56%,rgba(0,0,0,.68) 100%)}
#pc{position:absolute;left:3%;top:4%;font-size:clamp(14px,1.8vw,26px);letter-spacing:.12em;opacity:.4;transition:opacity 1.5s}
#hint{position:absolute;left:0;right:0;bottom:12%;text-align:center;opacity:0;letter-spacing:.3em;font-size:clamp(12px,1.4vw,20px);transition:opacity .2s}
#msg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.82);cursor:pointer;text-align:center;letter-spacing:.15em}
#msg b{font-weight:normal;font-size:clamp(16px,2.4vw,34px);opacity:.75}
#msg i{margin-top:1.2em;font-style:normal;font-size:clamp(11px,1.2vw,16px);opacity:.35;line-height:1.6}
</style>
</head>
<body>
<div id="wrap"><div id="box">
  <canvas id="st" width="96" height="54"></canvas>
  <div id="vg"></div>
  <div id="pc">Pages: 0 / 8</div>
  <div id="hint">[ E ]</div>
  <div id="msg"></div>
</div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="hub-nav.js"></script>
<script>
(()=>{
const $=id=>document.getElementById(id),box=$('box'),R=THREE,TOTAL=8;
const rnd=(a,b)=>a+Math.random()*(b-a),clamp=R.MathUtils.clamp;
let yaw=0,pitch=0,got=0,sanity=1,state='menu',locked=false,distort=0,unseen=0,aim=null,t=0,fl=0,flk=1,filtOn=false;
const keys={};

/* ---------- renderer / scene / camera / flashlight ---------- */
const renderer=new R.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.setClearColor(0x020408);
renderer.domElement.style.cssText='display:block;width:100%;height:100%';
box.prepend(renderer.domElement);
const scene=new R.Scene();
scene.fog=new R.FogExp2(0x020408,.033);
const cam=new R.PerspectiveCamera(65,16/9,.1,90);
cam.rotation.order='YXZ';cam.position.set(0,1.7,0);scene.add(cam);

// Main heavy-duty flashlight beam: focused 33-degree cone, 46-meter reach
const spot=new R.SpotLight(0xfff3df,3.4,46,0.58,0.5,1.0);
spot.position.set(.12,-.08,0);cam.add(spot);cam.add(spot.target);spot.target.position.set(0,0,-8);

// Wide spill / fill light: subtle fill on surrounding trees
const spillLight=new R.SpotLight(0xd0e0f8,0.7,24,0.95,0.7,1.4);
spillLight.position.set(0,0,0);cam.add(spillLight);cam.add(spillLight.target);spillLight.target.position.set(0,0,-8);

// Nocturnal ambient moonlight: subtle silhouette depth without washing out darkness
const ambient=new R.AmbientLight(0x142030,0.22);scene.add(ambient);

// Personal close-range lantern aura
const lantern=new R.PointLight(0xffeedd,0.35,7,1.8);lantern.position.set(0,0.1,0);cam.add(lantern);

function resize(){const w=box.clientWidth,h=box.clientHeight;renderer.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}
addEventListener('resize',resize);resize();

/* ---------- procedural textures ---------- */
function tex(w,h,fn,rx,ry){const c=document.createElement('canvas');c.width=w;c.height=h;fn(c.getContext('2d'),w,h);
  const T=new R.CanvasTexture(c);T.wrapS=T.wrapT=R.RepeatWrapping;T.repeat.set(rx,ry);return T}
const gT=tex(256,256,(x,w,h)=>{const im=x.createImageData(w,h),d=im.data;
  for(let i=0;i<d.length;i+=4){const v=20+Math.random()*36;d[i]=v*.82;d[i+1]=v;d[i+2]=v*.68;d[i+3]=255}
  x.putImageData(im,0,0);
  for(let i=0;i<260;i++){x.fillStyle=Math.random()<.5?'rgba(10,15,8,.22)':'rgba(60,75,50,.18)';x.beginPath();x.arc(rnd(0,w),rnd(0,h),rnd(2,14),0,7);x.fill()}},48,48);
const bT=tex(64,256,(x,w,h)=>{x.fillStyle='#2c221a';x.fillRect(0,0,w,h);
  for(let i=0;i<90;i++){x.fillStyle=Math.random()<.6?'rgba(12,8,6,.35)':'rgba(120,95,75,.22)';x.fillRect(rnd(0,w),0,rnd(1,4),h*rnd(.3,1))}
  for(let i=0;i<500;i++){x.fillStyle='rgba(0,0,0,.2)';x.fillRect(rnd(0,w),rnd(0,h),2,2)}},2,4);
const hT=tex(64,64,x=>{const g=x.createRadialGradient(32,32,0,32,32,32);
  g.addColorStop(0,'rgba(255,255,255,.9)');g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.fillRect(0,0,64,64)},1,1);
const WORDS=["DON'T LOOK",'NO FACE','BEHIND YOU','HE SEES','FOLLOWS','RUN','TALL MAN','LEAVE'];
const pageTex=()=>tex(128,176,(x,w,h)=>{x.fillStyle='#f4f1e6';x.fillRect(0,0,w,h);
  for(let i=0;i<500;i++){x.fillStyle=`rgba(90,80,60,${rnd(.02,.12)})`;x.fillRect(rnd(0,w),rnd(0,h),rnd(1,6),rnd(1,6))}
  x.strokeStyle='#111';x.lineWidth=3;x.beginPath();x.arc(64,34,8,0,7);
  x.moveTo(64,42);x.lineTo(64,110);x.moveTo(64,55);x.lineTo(36,135);x.moveTo(64,55);x.lineTo(92,135);
  x.moveTo(64,110);x.lineTo(54,150);x.moveTo(64,110);x.lineTo(74,150);x.stroke();
  for(let i=0;i<8;i++){x.beginPath();x.moveTo(rnd(0,w),rnd(0,h));x.lineTo(rnd(0,w),rnd(0,h));x.lineWidth=1;x.stroke()}
  x.fillStyle='#300';x.font='bold 15px serif';x.fillText(WORDS[Math.random()*8|0],10,168)},1,1);

/* ---------- ground + trees ---------- */
const ground=new R.Mesh(new R.PlaneGeometry(240,240),new R.MeshStandardMaterial({map:gT,roughness:1,metalness:0}));
ground.rotation.x=-Math.PI/2;scene.add(ground);
const barkM=new R.MeshStandardMaterial({map:bT,roughness:1}),trees=[];
for(let i=0;i<170;i++){
  let x,z;do{x=rnd(-60,60);z=rnd(-60,60)}while(Math.hypot(x,z)<5);
  const r=rnd(.22,.5),h=rnd(9,15),m=new R.Mesh(new R.CylinderGeometry(r*.75,r,h,8),barkM);
  m.position.set(x,h/2,z);m.rotation.y=Math.random()*6;scene.add(m);trees.push({x,z,r});
}

/* ---------- pages on tree trunks ---------- */
const pgs=[],cand=trees.filter(q=>Math.abs(q.x)<42&&Math.abs(q.z)<42&&Math.hypot(q.x,q.z)>12),picked=[];
for(let n=0;n<4000&&picked.length<TOTAL;n++){
  const q=cand[Math.random()*cand.length|0];
  if(!picked.includes(q)&&picked.every(p=>Math.hypot(p.x-q.x,p.z-q.z)>18))picked.push(q)}
for(const q of cand){if(picked.length>=TOTAL)break;if(!picked.includes(q))picked.push(q)}
picked.forEach(q=>{
  const a=Math.random()*6.283,nx=Math.cos(a),nz=Math.sin(a),g=new R.Group(),rr=q.r*.95+.02;
  g.position.set(q.x+nx*rr,rnd(1.3,1.9),q.z+nz*rr);g.rotation.y=Math.atan2(nx,nz);
  const paper=new R.Mesh(new R.PlaneGeometry(.42,.58),new R.MeshBasicMaterial({map:pageTex()}));
  const halo=new R.Mesh(new R.PlaneGeometry(1.6,1.6),new R.MeshBasicMaterial({map:hT,transparent:true,opacity:.2,blending:R.AdditiveBlending,depthWrite:false,fog:false}));
  halo.position.z=.02;g.add(paper,halo);scene.add(g);pgs.push({g,paper,halo});
});

/* ---------- the Entity (Slenderman) ---------- */
const mSuit=new R.MeshStandardMaterial({color:0x111317,roughness:0.8,metalness:0.1});
const mW=new R.MeshBasicMaterial({color:0xffffff});
const mTie=new R.MeshBasicMaterial({color:0x8b0000});
const ent=new R.Group();

function bx(w,h,l,m,x,y,z,p){const o=new R.Mesh(new R.BoxGeometry(w,h,l),m);o.position.set(x,y,z);(p||ent).add(o);return o}

// Slender legs (2.0m tall, lean)
bx(.2,2.0,.2,mSuit,-.18,1.0,0);
bx(.2,2.0,.2,mSuit,.18,1.0,0);

// Torso (dark tailored suit)
bx(.64,1.6,.34,mSuit,0,2.75,0);

// White dress shirt & collar
bx(.18,1.35,.04,mW,0,2.82,.18);
bx(.26,.18,.06,mW,0,3.42,.17);

// Blood red tie
bx(.07,1.0,.05,mTie,0,2.85,.21);

// Towering faceless head with eerie halo glow that cuts through fog
const head=new R.Group();head.position.set(0,3.85,0);
const headGeo=new R.SphereGeometry(.26,16,16);headGeo.scale(.85,1.35,.95);
const headMesh=new R.Mesh(headGeo,mW);head.add(headMesh);

const headGlow=new R.Mesh(new R.PlaneGeometry(1.8,1.8),new R.MeshBasicMaterial({
  map:hT,transparent:true,opacity:0.5,blending:R.AdditiveBlending,depthWrite:false,fog:false
}));
headGlow.position.set(0,0,.05);head.add(headGlow);
ent.add(head);

// Long hanging arms with pale hands
function arm(sx,len,th,rz,rx,y){const g=new R.Group();g.position.set(sx*.34,y,0);
  bx(th,len,th,mSuit,0,-len/2,0,g);
  bx(th*1.6,.45,th*1.6,mW,0,-len-.2,0,g);
  g.rotation.z=sx*rz;g.rotation.x=rx;ent.add(g)}
arm(-1,2.7,.12,.08,.05,3.3);
arm(1,2.7,.12,.08,-.05,3.3);

// Writhing black tendrils on his back (animated in loop)
const tendrils=[];
for(let i=0;i<4;i++){
  const tg=new R.Group(),side=(i%2===0?-1:1),yPos=3.2-(i>1?.4:0);
  tg.position.set(side*.24,yPos,-.16);
  const tenLen=2.8+(i*.35);
  const tenMesh=bx(.08,tenLen,.08,mSuit,0,tenLen/2,0,tg);
  tenMesh.rotation.z=side*.38;tenMesh.rotation.x=-.38-(i*.16);
  ent.add(tg);
  tendrils.push({group:tg,side,speed:1.6+i*.35,phase:i*1.4});
}
scene.add(ent);

let graceTimer = 0;
function place(d, angleOffset) {
  const a = yaw + (angleOffset !== undefined ? angleOffset : rnd(-0.85, 0.85));
  let ex = clamp(cam.position.x - Math.sin(a)*d, -52, 52);
  let ez = clamp(cam.position.z - Math.cos(a)*d, -52, 52);
  for (const q of trees) {
    const dx = ex - q.x, dz = ez - q.z, distTree = Math.hypot(dx, dz);
    if (distTree < q.r + 0.6) {
      ex = q.x + (dx / (distTree || 1)) * (q.r + 0.8);
      ez = q.z + (dz / (distTree || 1)) * (q.r + 0.8);
    }
  }
  ent.position.set(ex, 0, ez);
  ent.rotation.y = Math.atan2(cam.position.x - ent.position.x, cam.position.z - ent.position.z);
}

function diff() {
  scene.fog.density = 0.033 + 0.004 * got;
  spot.distance = 46 - 1.2 * got;
  spillLight.distance = 24 - 0.8 * got;
}
place(36, rnd(-0.5, 0.5)); diff();

/* ---------- procedural audio ---------- */
let AC,droneG,noiseG,lastSting=0;
function audio(){if(AC){AC.resume();return}
  try{AC=new(window.AudioContext||window.webkitAudioContext)();
    droneG=AC.createGain();droneG.gain.value=.05;droneG.connect(AC.destination);
    [48,50.5,97].forEach(f=>{const o=AC.createOscillator(),lp=AC.createBiquadFilter();o.type='sawtooth';o.frequency.value=f;lp.frequency.value=180;o.connect(lp);lp.connect(droneG);o.start()});
    const b=AC.createBuffer(1,AC.sampleRate,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    const n=AC.createBufferSource(),g=AC.createGain();n.buffer=b;n.loop=true;g.gain.value=0;n.connect(g);g.connect(AC.destination);n.start();noiseG=g;
  }catch(e){}}

function stingSound(){
  if(!AC||AC.state!=='running')return;
  const now=AC.currentTime;
  if(now-lastSting<5.0)return;
  lastSting=now;
  try{
    const o=AC.createOscillator(),g=AC.createGain(),f=AC.createBiquadFilter();
    o.type='sawtooth';o.frequency.setValueAtTime(150,now);o.frequency.exponentialRampToValueAtTime(45,now+.9);
    f.type='lowpass';f.frequency.setValueAtTime(550,now);
    g.gain.setValueAtTime(.28,now);g.gain.exponentialRampToValueAtTime(.001,now+1.1);
    o.connect(f);f.connect(g);g.connect(AC.destination);o.start(now);o.stop(now+1.1);
    [587,622,880].forEach(freq=>{
      const osc=AC.createOscillator(),gn=AC.createGain();
      osc.type='triangle';osc.frequency.setValueAtTime(freq,now);
      gn.gain.setValueAtTime(.09,now);gn.gain.exponentialRampToValueAtTime(.0001,now+.85);
      osc.connect(gn);gn.connect(AC.destination);osc.start(now);osc.stop(now+.85);
    });
  }catch(_){}
}

/* ---------- UI / state helpers ---------- */
const sc=$('st'),sx=sc.getContext('2d'),sd=sx.createImageData(96,54);
function stat(a){sc.style.opacity=a;if(a<.03)return;const d=sd.data;for(let i=0;i<d.length;i+=4){d[i]=d[i+1]=d[i+2]=Math.random()*255;d[i+3]=255}sx.putImageData(sd,0,0)}
if (window.HubNav) {
  HubNav.init({ gameId: 'slender', disablePauseOverlay: true });
}

const slenderStops = (window.HubNav && HubNav.GAME_CONFIGS.slender) ? HubNav.GAME_CONFIGS.slender.stops : [
  { offset: '0%', color: '#fff0d0' },
  { offset: '50%', color: '#52796f' },
  { offset: '100%', color: '#16211d' }
];

const starSvg = () => window.HubNav ? HubNav.createStarSvg('slenderGrad', slenderStops, 'hub-hero-star') : '';

const show = (title, sub) => {
  $('msg').innerHTML = `
    <div style="position:relative; z-index:2; display:flex; flex-direction:column; align-items:center; max-width:440px; padding:20px;">
      <div style="width:78px; height:78px; margin-bottom:12px;">${starSvg()}</div>
      <b>${title}</b>
      <i>${sub}</i>
      <a href="../index.html" class="hub-btn hub-btn-secondary" style="margin-top:16px; text-decoration:none; padding:8px 22px; font-size:13px; z-index:10;">← Back to Hub</a>
    </div>
  `;
  $('msg').style.display = 'flex';
};

show('EIGHT PAGES', 'Click to start (Requires Mouse Lock)<br>WASD move · Shift run · E take page · Esc pause');

function die(){if(state!=='play')return;state='dead';document.exitPointerLock();
  ent.position.set(cam.position.x-Math.sin(yaw)*1.1,0,cam.position.z-Math.cos(yaw)*1.1);
  ent.rotation.y=Math.atan2(cam.position.x-ent.position.x,cam.position.z-ent.position.z);pitch=.95;
  setTimeout(()=>show('IT FOUND YOU', 'Click to try again'),1100)}
function take(p){scene.remove(p.g);pgs.splice(pgs.indexOf(p),1);got++;
  $('pc').textContent=`Pages: ${got} / ${TOTAL}`;$('pc').style.opacity=1;setTimeout(()=>$('pc').style.opacity=.4,1800);
  if(got>=TOTAL){state='won';document.exitPointerLock();$('hint').style.opacity=0;show('YOU MADE IT OUT', 'Click to play again');return}
  diff();
  graceTimer = Math.max(3.5, 7.5 - got * 0.5);
  const standDist = Math.max(16, 36 - got * 2.4);
  place(standDist, rnd(-1.1, 1.1));
  unseen = 0;}

/* ---------- input (native Pointer Lock API) ---------- */
$('msg').addEventListener('click', e => {
  if (e.target && e.target.closest('a')) return;
  if(state==='dead'||state==='won'){location.reload();return}
  audio();renderer.domElement.requestPointerLock()});
document.addEventListener('pointerlockchange',()=>{
  locked=document.pointerLockElement===renderer.domElement;
  if(locked){state='play';$('msg').style.display='none'}
  else if(state==='play'){state='menu';show('PAUSED', 'Click to resume')}});
document.addEventListener('mousemove',e=>{if(!locked)return;yaw-=e.movementX*.0022;pitch=clamp(pitch-e.movementY*.0022,-1.45,1.45)});
addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='KeyE'&&state==='play'&&aim)take(aim)});
addEventListener('keyup',e=>keys[e.code]=false);
addEventListener('blur',()=>{for(const k in keys)keys[k]=false});

/* ---------- main loop ---------- */
const clk=new R.Clock(),fwd=new R.Vector3(),toE=new R.Vector3(),ray=new R.Raycaster();ray.far=3.2;
function loop(){
  requestAnimationFrame(loop);
  const dt=Math.min(clk.getDelta(),.05);t+=dt;
  const p=cam.position,sh=()=>(Math.random()-.5)*distort*.03;
  let dist=99,look=0,noise=0,dot=0;
  cam.rotation.set(pitch+sh(),yaw+sh(),0);

  if(state==='play'){
    const f=(keys.KeyW?1:0)-(keys.KeyS?1:0),s=(keys.KeyD?1:0)-(keys.KeyA?1:0),run=keys.ShiftLeft||keys.ShiftRight;
    if(f||s){const sp=(run?5.4:3.3)*dt/Math.hypot(f,s);
      p.x+=(-Math.sin(yaw)*f+Math.cos(yaw)*s)*sp;p.z+=(-Math.cos(yaw)*f-Math.sin(yaw)*s)*sp}
    p.x=clamp(p.x,-48,48);p.z=clamp(p.z,-48,48);
    for(const q of trees){const dx=p.x-q.x,dz=p.z-q.z,m=q.r+.35,d2=dx*dx+dz*dz;
      if(d2<m*m&&d2>1e-6){const d=Math.sqrt(d2);p.x=q.x+dx/d*m;p.z=q.z+dz/d*m}}
    p.y=1.7+((f||s)?Math.sin(t*(run?11:7.5))*.035:0);

    // Entity: dot product of camera direction and direction-to-entity
    toE.set(ent.position.x-p.x,3.2-p.y,ent.position.z-p.z);dist=toE.length();toE.normalize();
    cam.getWorldDirection(fwd);dot=fwd.dot(toE);

    // Seen: in player's field of view (dot > 0.50) and within visible distance
    const seen=dot>.50&&dist<52;
    const lookingDirect=dot>.82&&dist<36;

    if(graceTimer>0)graceTimer-=dt;

    if(seen&&dot>.75)stingSound();

    if(got>0&&graceTimer<=0){
      if(!seen){
        // While player is NOT looking: Slender stalks via timed relocations in front/flank
        unseen+=dt;
        const stalkInterval=Math.max(5.5,12.5-got*1.0);
        if(unseen>stalkInterval){
          unseen=0;
          const targetDist=Math.max(14,34-got*2.2);
          place(targetDist,rnd(-1.2,1.2));
        }else if(dist>54){
          // If player ran far away, relocate into stalking range
          place(Math.max(20,36-got*2.0),rnd(-1.1,1.1));
        }
      }else{
        // Looking at him FREEZES him! Classic Slender rule.
        unseen=0;
      }
    }else if(got===0){
      // Before Page 1: Slenderman is visible in the distance watching the player
      if(!seen){
        unseen+=dt;
        if(unseen>14){
          unseen=0;
          place(rnd(30,40),rnd(-0.85,0.85));
        }
      }else{
        unseen=0;
      }
      if(dist<14){
        place(rnd(32,42),rnd(-0.85,0.85));
      }
    }

    ent.rotation.y=Math.atan2(p.x-ent.position.x,p.z-ent.position.z);

    // Dynamic tendril animation
    tendrils.forEach(ten=>{
      ten.group.rotation.z=Math.sin(t*ten.speed+ten.phase)*0.18*ten.side;
      ten.group.rotation.x=Math.cos(t*ten.speed*0.8+ten.phase)*0.22;
    });

    // Face the head glow halo towards camera
    headGlow.quaternion.copy(cam.quaternion);

    // Fair sanity and stare tension
    if(lookingDirect&&got>0){
      const drainMult=dist<8?0.32:(dist<18?0.15:0.05);
      sanity-=dt*drainMult*(1+0.1*got);
      look=Math.min(1,(36-dist)/24);
    }else if(seen&&got>0){
      look=Math.max(look,0.22);
      sanity-=dt*0.02;
    }else if(seen&&got===0){
      look=Math.max(look,0.18);
      sanity=Math.min(1,sanity+dt*0.04);
    }else{
      // Faster recovery when looking away
      sanity=Math.min(1,sanity+dt*0.08);
    }

    head.rotation.z=(look>0.3)?(Math.sin(t*8)*0.15):0;
    if(got>0&&(sanity<=0||(dist<1.6&&lookingDirect)))die();

    // Natural flashlight flicker: atmospheric, no disco seizure
    fl-=dt;
    if(fl<=0){
      fl=rnd(0.2,0.8);
      const isFlickering=(look>0.4&&Math.random()<0.35)||(sanity<0.3&&Math.random()<0.25);
      flk=isFlickering?rnd(0.65,0.9):1;
    }
    const baseBright=3.4-0.08*got;
    spot.intensity=baseBright*flk;
    spillLight.intensity=(0.7-0.03*got)*flk;
    lantern.intensity=0.35*flk;

    // page detection (expanded raycast distance)
    ray.setFromCamera({x:0,y:0},cam);
    ray.far=4.2;
    const hit=ray.intersectObjects(pgs.map(q=>q.paper));
    aim=hit.length?pgs.find(q=>q.paper===hit[0].object):null;
    $('hint').style.opacity=aim?0.85:0;
  }else if(state==='dead'){look=1;noise=1}

  pgs.forEach(q=>q.halo.material.opacity=.16+.07*Math.sin(t*3+q.g.position.x));

  // screen distortion + static (atmospheric, no rainbow strobe invert)
  distort+=(look-distort)*Math.min(1,dt*6);
  const ins=1-sanity;
  // Natural proximity static cue when facing in his direction even before direct line of sight
  const dirStatic=(dot>0.35&&dist<36)?(36-dist)/36*0.25:0;
  noise=Math.max(distort*0.7,ins*0.5,dirStatic,dist<14?(14-dist)/14*0.45:0);

  if(distort>0.04||ins>0.08){
    const contrastVal=(1+distort*0.4+ins*0.2).toFixed(2);
    const brightVal=Math.max(0.65, 1-ins*0.2).toFixed(2);
    const blurVal=(distort*1.0).toFixed(1);
    box.style.filter=`contrast(${contrastVal}) brightness(${brightVal}) blur(${blurVal}px)`;
    filtOn=true;
  }else if(filtOn){box.style.filter='none';filtOn=false}
  stat(noise*0.65);
  if(noiseG){droneG.gain.value=.05+.01*got+(dist<30?(30-dist)*.004:0);noiseG.gain.value=noise*.22}

  renderer.render(scene,cam);
}
loop();
})();
</script>
</body>
</html>
