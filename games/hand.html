<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Articulated 3D Hand</title>
<style>
  /* ---------- Page & canvas ---------- */
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a2030;
               font-family: "Segoe UI", system-ui, -apple-system, sans-serif; }
  canvas { display: block; }

  /* ---------- Hint label (top-left) ---------- */
  #hint { position: absolute; top: 18px; left: 22px; color: rgba(255,255,255,.65);
          font-size: 13px; letter-spacing: .04em; pointer-events: none; user-select: none; }
  #hint b { color: #fff; font-size: 16px; display: block; margin-bottom: 4px; letter-spacing: .08em; }

  /* ---------- Gesture button bar (bottom-center) ---------- */
  #ui { position: absolute; left: 50%; bottom: 28px; transform: translateX(-50%);
        display: flex; gap: 10px; padding: 10px; border-radius: 18px;
        background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.15);
        backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
        box-shadow: 0 10px 30px rgba(0,0,0,.35); }
  #ui button { appearance: none; border: 0; cursor: pointer; color: #e9edf7;
               background: rgba(255,255,255,.07); padding: 12px 26px; border-radius: 12px;
               font-size: 15px; font-weight: 600; letter-spacing: .05em;
               transition: background .2s, transform .15s, box-shadow .2s; }
  #ui button:hover  { background: rgba(255,255,255,.18); transform: translateY(-2px); }
  #ui button:active { transform: translateY(0); }
  #ui button.active { background: linear-gradient(135deg, #ff9a6b, #e8567a); color: #fff;
                      box-shadow: 0 4px 16px rgba(232,86,122,.5); }
</style>
</head>
<body>

<div id="hint"><b>3D HAND</b>Drag to orbit &bull; Scroll to zoom &bull; Right-drag to pan</div>
<div id="ui">
  <button data-pose="grab">Grab</button>
  <button data-pose="release" class="active">Release</button>
  <button data-pose="point">Point</button>
</div>

<!-- Three.js (+ addons) from CDN via import map -->
<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

/* =====================================================================
   CONFIG – tweak colors, speeds and joint angles here
   ===================================================================== */
const COLORS = {
  background: 0x1a2030,
  skin:       0xe2b49a,   // try 0xb8c4d6 + metalness 0.8 for a "robot" look
  nail:       0xf3d2c8,
  cuff:       0x2f3650,
  ground:     0x262c3d,
};
const SKIN_ROUGHNESS = 0.55;
const SKIN_METALNESS = 0.0;
const ANIM_SPEED     = 7;   // higher = faster transitions

/* Finger layout. Joint order for all fingers: [MCP (knuckle), PIP, DIP]
   lengths = phalanx lengths, radius = base thickness, splay = Z-rotation (fan out) */
const FINGERS = {
  index:  { x: -1.20, y: 3.20, lengths: [1.20, 0.85, 0.70], radius: 0.36, splay:  0.08 },
  middle: { x: -0.40, y: 3.30, lengths: [1.30, 0.95, 0.75], radius: 0.37, splay:  0.02 },
  ring:   { x:  0.40, y: 3.20, lengths: [1.20, 0.90, 0.72], radius: 0.35, splay: -0.05 },
  pinky:  { x:  1.10, y: 3.00, lengths: [0.95, 0.65, 0.58], radius: 0.30, splay: -0.14 },
};
/* Thumb joint order: [CMC (base), MCP, IP]. 'twist' rotates the curl plane toward the palm */
const THUMB = { pos: [-1.5, 0.9, 0.3], tilt: 0.8, twist: 0.9, lengths: [1.1, 0.9, 0.75], radius: 0.40 };

/* Target joint angles in radians (positive X rotation = curl toward the palm).
   Each array is [joint1, joint2, joint3] as described above. */
const FIST = [1.48, 1.75, 1.13];
const POSES = {
  release: {
    thumb:  [0.10, 0.12, 0.10],
    index:  [0.12, 0.18, 0.10],
    middle: [0.15, 0.22, 0.12],
    ring:   [0.20, 0.25, 0.14],
    pinky:  [0.25, 0.28, 0.15],
  },
  grab: {
    thumb:  [0.70, 0.75, 0.80],
    index:  FIST, middle: FIST, ring: FIST, pinky: [1.5, 1.75, 1.1],
  },
  point: {
    thumb:  [0.70, 0.75, 0.80],
    index:  [0, 0, 0],                       // fully extended
    middle: FIST, ring: FIST, pinky: [1.5, 1.75, 1.1],
  },
};

/* =====================================================================
   SCENE, CAMERA, RENDERER
   ===================================================================== */
const scene = new THREE.Scene();
scene.background = new THREE.Color(COLORS.background);
scene.fog = new THREE.Fog(COLORS.background, 20, 40);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 100);
camera.position.set(6, 4.5, 11);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2, 0);
controls.enableDamping = true;
controls.minDistance = 5;
controls.maxDistance = 25;
controls.maxPolarAngle = Math.PI * 0.55;   // don't orbit under the floor
controls.update();

/* =====================================================================
   LIGHTING
   ===================================================================== */
scene.add(new THREE.AmbientLight(0xffffff, 0.55));

const key = new THREE.DirectionalLight(0xfff2e6, 2.2);
key.position.set(5, 10, 8);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -9, right: 9, top: 9, bottom: -9, near: 1, far: 35 });
key.shadow.bias = -0.0004;
key.shadow.normalBias = 0.03;
scene.add(key);

const fill = new THREE.DirectionalLight(0x8fb4ff, 0.7);   // cool fill from the opposite side
fill.position.set(-8, 4, 4);
scene.add(fill);

/* =====================================================================
   GROUND
   ===================================================================== */
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(30, 64),
  new THREE.MeshStandardMaterial({ color: COLORS.ground, roughness: 0.9 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -2.2;
ground.receiveShadow = true;
scene.add(ground);

/* =====================================================================
   HAND CONSTRUCTION HELPERS
   ===================================================================== */
const skinMat = new THREE.MeshStandardMaterial({
  color: COLORS.skin, roughness: SKIN_ROUGHNESS, metalness: SKIN_METALNESS });
const nailMat = new THREE.MeshStandardMaterial({ color: COLORS.nail, roughness: 0.25 });
const cuffMat = new THREE.MeshStandardMaterial({ color: COLORS.cuff, roughness: 0.35, metalness: 0.6 });

/** Create a shadow-enabled mesh */
function mesh(geometry, material = skinMat) {
  const m = new THREE.Mesh(geometry, material);
  m.castShadow = m.receiveShadow = true;
  return m;
}

/**
 * Builds a chain of bones: joint -> (sphere + capsule) -> child joint -> ...
 * Each joint is a Group whose rotation.x bends the finger.
 * Returns the array of joint groups, base first.
 */
function buildChain(parent, lengths, radius) {
  const joints = [];
  lengths.forEach((len, i) => {
    const r = radius * (1 - i * 0.09);                      // taper toward the tip
    const joint = new THREE.Group();
    joint.position.y = i === 0 ? 0 : lengths[i - 1];        // sit at end of previous bone
    parent.add(joint);

    joint.add(mesh(new THREE.SphereGeometry(r * 1.03, 24, 16)));          // knuckle
    const bone = mesh(new THREE.CapsuleGeometry(r, Math.max(len - 2 * r, 0.01), 8, 20));
    bone.position.y = len / 2;                                            // extends along +Y
    joint.add(bone);

    if (i === lengths.length - 1) {                                       // fingernail (back of hand = -Z)
      const nail = mesh(new THREE.SphereGeometry(1, 16, 12), nailMat);
      nail.scale.set(r * 0.62, len * 0.32, r * 0.2);
      nail.position.set(0, len * 0.62, -r * 0.82);
      joint.add(nail);
    }
    joints.push(joint);
    parent = joint;
  });
  return joints;
}

/* =====================================================================
   BUILD THE HAND   (palm faces +Z, fingers point +Y, thumb on -X)
   ===================================================================== */
const handRoot = new THREE.Group();
scene.add(handRoot);

// Palm: rounded box + muscle pads
const palm = mesh(new RoundedBoxGeometry(3.3, 3.4, 1.0, 5, 0.4));
palm.position.set(0, 1.7, 0);
handRoot.add(palm);

const thenar = mesh(new THREE.SphereGeometry(1, 24, 16));     // thumb-side pad
thenar.scale.set(0.85, 1.25, 0.55);
thenar.position.set(-1.0, 1.0, 0.3);
handRoot.add(thenar);

const hypothenar = mesh(new THREE.SphereGeometry(1, 24, 16)); // pinky-side pad
hypothenar.scale.set(0.7, 1.2, 0.5);
hypothenar.position.set(1.05, 1.1, 0.25);
handRoot.add(hypothenar);

// Wrist + decorative cuff (hides the cut-off end)
const wrist = new THREE.Group();
wrist.scale.z = 0.7;
const wristMesh = mesh(new THREE.CylinderGeometry(0.85, 0.78, 2.2, 32));
wristMesh.position.y = -0.7;
const cuff = mesh(new THREE.CylinderGeometry(0.98, 0.98, 0.55, 32), cuffMat);
cuff.position.y = -1.55;
wrist.add(wristMesh, cuff);
handRoot.add(wrist);

/* Fingers: store joints per finger so we can animate them by name */
const joints = {};
for (const [name, cfg] of Object.entries(FINGERS)) {
  const root = new THREE.Group();
  root.position.set(cfg.x, cfg.y, 0.3);     // knuckle sits on front-top edge of the palm
  root.rotation.z = cfg.splay;
  handRoot.add(root);
  joints[name] = buildChain(root, cfg.lengths, cfg.radius);
}

/* Thumb: tilted root -> CMC joint (with twist) -> MCP -> IP */
const thumbRoot = new THREE.Group();
thumbRoot.position.set(...THUMB.pos);
thumbRoot.rotation.z = THUMB.tilt;
handRoot.add(thumbRoot);
joints.thumb = buildChain(thumbRoot, THUMB.lengths, THUMB.radius);
joints.thumb[0].rotation.order = 'YXZ';       // twist (Y) stays fixed, curl (X) animates
joints.thumb[0].rotation.y = THUMB.twist;

/* =====================================================================
   POSE / ANIMATION SYSTEM
   ===================================================================== */
let targetPose = POSES.release;

// Snap to the starting pose
for (const name in joints) joints[name].forEach((j, i) => (j.rotation.x = targetPose[name][i]));

/** Select a gesture (called by the UI buttons) */
function setPose(name) {
  targetPose = POSES[name];
  document.querySelectorAll('#ui button').forEach(b =>
    b.classList.toggle('active', b.dataset.pose === name));
}
document.querySelectorAll('#ui button').forEach(b =>
  b.addEventListener('click', () => setPose(b.dataset.pose)));

/** Frame-rate independent exponential easing of every joint toward its target angle */
function updateHand(dt) {
  for (const name in joints) {
    joints[name].forEach((joint, i) => {
      const speed = ANIM_SPEED * (1 - i * 0.12);          // distal joints lag slightly = more organic
      const k = 1 - Math.exp(-dt * speed);
      joint.rotation.x += (targetPose[name][i] - joint.rotation.x) * k;
    });
  }
}

/* =====================================================================
   MAIN LOOP & RESIZE
   ===================================================================== */
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  updateHand(Math.min(clock.getDelta(), 0.05));
  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
