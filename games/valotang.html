<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Valotang</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>
:root{--c:#3fe8d5;--ink:#0f1923;--bone:#ece8e1;--red:#ff4655;box-sizing:border-box}
*{margin:0;box-sizing:border-box}
html,body{height:100%;background:#000;overflow:hidden;font:700 15px Bahnschrift,"Arial Narrow","Trebuchet MS",system-ui,sans-serif;color:var(--bone);user-select:none}
canvas{display:block}
.h{position:fixed;pointer-events:none;text-shadow:0 1px 3px #000}
#top{top:calc(8px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);text-align:center;font-size:22px}
#mm{top:calc(8px + env(safe-area-inset-top,0px));left:8px;border:2px solid #ece8e155;background:#0f1923bb}
#kf{top:calc(8px + env(safe-area-inset-top,0px));right:10px;text-align:right;line-height:1.6}
#st{bottom:calc(14px + env(safe-area-inset-bottom,0px));left:16px;font-size:28px}
#wp{bottom:calc(14px + env(safe-area-inset-bottom,0px));right:16px;text-align:right;font-size:26px;line-height:1.3}
#msg{top:26%;width:100%;text-align:center;font-size:32px;white-space:pre-line;color:var(--bone)}
#ch{top:50%;left:50%}
#ch i{position:absolute;background:var(--c);width:2px;height:8px;margin:-4px -1px}
#fl{inset:0;background:#fff;opacity:0}
#sc{inset:0;display:none;background:linear-gradient(#000,#000) center/1px 100% no-repeat,linear-gradient(#000,#000) center/100% 1px no-repeat,radial-gradient(circle,#0000 30vmin,#000 30.5vmin)}
#bar{top:58%;left:50%;width:160px;height:8px;margin-left:-80px;background:#0f1923cc;display:none}
#bar b{display:block;height:100%;background:var(--red)}
#buy{top:50%;left:50%;transform:translate(-50%,-50%);background:#0f1923ee;border-left:4px solid var(--red);padding:16px 24px;display:none;line-height:1.9;font-size:18px}
#pz{inset:0;background:#0f1923ee;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.8;white-space:pre-line;padding:20px}
</style></head><body>
<div class="h" id="top"></div><canvas class="h" id="mm" width="160" height="160"></canvas>
<div class="h" id="kf"></div><div class="h" id="st"></div><div class="h" id="wp"></div>
<div class="h" id="ch"><i></i><i></i><i></i><i></i></div><div class="h" id="bar"><b></b></div>
<div class="h" id="msg"></div><div class="h" id="buy"></div><div class="h" id="fl"></div><div class="h" id="sc"></div>
<div class="h" id="pz"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id),T=THREE,R=Math.random,PI=Math.PI,rc=new T.Raycaster(),ln=new T.Line3(),tv=new T.Vector3(),V=(x,y,z)=>new T.Vector3(x,y,z);
$('pz').textContent='Valotang\nClick to play\n\nWASD move, Shift walk, Space jump, Left-click fire, Right-click aim\nR reload, 1 primary, 2 Classic, B buy (freeze time)\nE smoke, Q flash, C molly\nHold 4 inside an orange site circle to plant\nFirst to 5 rounds wins';
const ren=new T.WebGLRenderer({antialias:true});ren.setPixelRatio(Math.min(devicePixelRatio,1.5));ren.setSize(innerWidth,innerHeight);ren.shadowMap.enabled=true;document.body.prepend(ren.domElement);
const scene=new T.Scene(),cam=new T.PerspectiveCamera(75,innerWidth/innerHeight,.05,600);cam.rotation.order='YXZ';scene.add(cam);scene.fog=new T.Fog(0xb9c4d0,45,170);
scene.add(new T.HemisphereLight(0xdde8ff,0x554433,.85));
const sun=new T.DirectionalLight(0xfff0d0,.8);sun.position.set(25,45,15);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);const sh=sun.shadow.camera;sh.left=sh.bottom=-45;sh.right=sh.top=45;sh.far=120;scene.add(sun);
const VS='varying vec3 v;void main(){v=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}';
const FSK='varying vec3 v;void main(){vec3 d=normalize(v);vec3 c=mix(vec3(.95,.8,.62),vec3(.2,.45,.85),pow(max(d.y,0.),.5));c+=vec3(1.,.75,.4)*pow(max(dot(d,normalize(vec3(.5,.35,-.6))),0.),48.);gl_FragColor=vec4(c,1.);}';
const FSM='uniform float t,k;varying vec3 v;float h(vec3 p){return fract(sin(dot(p,vec3(12.9898,78.233,37.719)))*43758.5453);}float n(vec3 p){vec3 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(mix(h(i),h(i+vec3(1,0,0)),f.x),mix(h(i+vec3(0,1,0)),h(i+vec3(1,1,0)),f.x),f.y),mix(mix(h(i+vec3(0,0,1)),h(i+vec3(1,0,1)),f.x),mix(h(i+vec3(0,1,1)),h(i+vec3(1,1,1)),f.x),f.y),f.z);}void main(){float d=n(v*3.+t*.4)*.6+n(v*7.-t*.3)*.4;gl_FragColor=vec4(mix(vec3(.55,.6,.68),vec3(.88,.9,.94),d),(.9+.1*d)*k);}';
const FSF='uniform float t;varying vec3 v;void main(){vec2 u=v.xy/3.5;float r=length(u);float f=sin(u.x*14.+t*7.)*sin(u.y*14.-t*6.)*.5+.5;gl_FragColor=vec4(1.,.3+.45*f,.05,smoothstep(1.,.45,r)*(.5+.5*f));}';
const SM=(f,u,o)=>new T.ShaderMaterial(Object.assign({vertexShader:VS,fragmentShader:f,uniforms:u},o));
scene.add(new T.Mesh(new T.SphereGeometry(400,16,12),SM(FSK,{},{side:T.BackSide,depthWrite:false})));
const walls=[],B=[],bars=[],sites=[[-20,-17],[20,-17]],G=0x80838a,C=0xa06a35,O=0xe8891a;
const floor=new T.Mesh(new T.PlaneGeometry(64,64),new T.MeshLambertMaterial({color:0x9a968c}));floor.rotation.x=-PI/2;floor.receiveShadow=true;scene.add(floor);walls.push(floor);
const grid=new T.GridHelper(64,32,0x7a766e,0x8a867e);grid.position.y=.01;scene.add(grid);
function box(x,z,w,d,h,c){const m=new T.Mesh(new T.BoxGeometry(w,h,d),new T.MeshLambertMaterial({color:c}));m.position.set(x,h/2,z);m.castShadow=m.receiveShadow=true;scene.add(m);walls.push(m);B.push({x,z,w,d})}
[[0,-31,64,2,7,G],[0,31,64,2,7,G],[-31,0,2,60,7,G],[31,0,2,60,7,G],
[-19,24,22,1,6,G],[19,24,22,1,6,G],[-19,-22,22,1,6,G],[19,-22,22,1,6,G],
[-11,-6,1,12,5,G],[-11,12,1,12,5,G],[11,-6,1,12,5,G],[11,12,1,12,5,G],
[-27,-14,3,3,2.4,C],[-15.5,-12.5,2,2,2.4,C],[27,-14,3,3,2.4,C],[15.5,-12.5,2,2,2.4,C],
[0,-4,4,4,3.5,G],[0,6,3,3,2.2,C],[-6,-11,1,4,2,O],[6,-11,1,4,2,O],[-24,5,1,6,2,O],[24,5,1,6,2,O]].forEach(a=>box(...a));
[[0,24],[0,-22]].forEach(([x,z])=>{const m=new T.Mesh(new T.BoxGeometry(16,6,.4),new T.MeshBasicMaterial({color:0x44aaff,transparent:true,opacity:.3}));m.position.set(x,3,z);scene.add(m);bars.push({x,z,w:16,d:1,m})});
sites.forEach(q=>{const m=new T.Mesh(new T.CircleGeometry(5,32),new T.MeshBasicMaterial({color:0xf5b301,transparent:true,opacity:.45}));m.rotation.x=-PI/2;m.position.set(q[0],.03,q[1]);scene.add(m)});
const spike=new T.Mesh(new T.BoxGeometry(.5,.25,.5),new T.MeshBasicMaterial({color:0xff2a2a}));spike.visible=false;scene.add(spike);
const gun=new T.Mesh(new T.BoxGeometry(.07,.09,.5),new T.MeshLambertMaterial({color:0x222222}));gun.position.set(.22,-.2,-.55);cam.add(gun);
const WP={
classic:{n:'Classic',rate:.17,mag:12,res:36,sp:.004,kp:.012,ks:.004,bl:.004,d:{h:78,b:26,l:22},auto:0,rl:1.5,zoom:60},
vandal:{n:'Vandal',rate:.1,mag:25,res:50,sp:.003,kp:.016,ks:.014,bl:.002,d:{h:150,b:40,l:30},auto:1,rl:2.5,zoom:55},
operator:{n:'Operator',rate:1.5,mag:5,res:15,sp:.07,kp:.04,ks:0,bl:0,d:{h:150,b:150,l:80},auto:0,rl:3.5,zoom:18,sn:1}};
const SH=[['Vandal',2900,'vandal'],['Operator',4700,'operator'],['Light shield',400,25],['Heavy shield',1000,50]];
const P={x:0,y:0,z:27,vx:0,vz:0,vy:0,hp:100,ar:0},S={ph:'freeze',t:10,sc:[0,0],sp:0,sb:45,bt:0,pl:0,df:0,pd:0},K={};
let yaw=0,pit=0,rp=0,ry=0,lock=0,fb=0,md=0,trig=0,ads=0,cur='classic',pri=0,own={classic:1},cr=800,rel=0,cd=0,si=0,bloom=0,ls=-9,tm=0,flb=0,gk=0,mt=0,bq=0,AB={},AM={},AC;
const smokes=[],fires=[],gr=[],tr=[],dec=[],mc=$('mm').getContext('2d');
const ap=(v,t,d)=>v<t?Math.min(v+d,t):Math.max(v-d,t);
const prune=(a,f)=>{for(let i=a.length;i--;)if(f(a[i])){scene.remove(a[i].m);a.splice(i,1)}};
function snd(f,d=.08,v=.08,ty='square'){if(!AC)return;const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(Math.max(30,f/3),t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(t+d)}
const msg=(t,d=0)=>{$('msg').textContent=t;mt=d};
function feed(t){const d=document.createElement('div');d.textContent=t;$('kf').append(d);setTimeout(()=>d.remove(),5000)}
function blocked(x,z,r){for(const b of B)if(Math.abs(x-b.x)<b.w/2+r&&Math.abs(z-b.z)<b.d/2+r)return 1;if(S.ph=='freeze')for(const b of bars)if(Math.abs(x-b.x)<b.w/2+r&&Math.abs(z-b.z)<b.d/2+r)return 1;return 0}
function mv(p,dx,dz,r){if(!blocked(p.x+dx,p.z,r))p.x+=dx;else dx=0;if(!blocked(p.x,p.z+dz,r))p.z+=dz;else dz=0;return[dx,dz]}
function smk(a,b){return smokes.some(s=>{ln.set(a,b);ln.closestPointToPoint(s.p,true,tv);return tv.distanceTo(s.p)<s.r*s.a})}
function los(a,b){tv.copy(b).sub(a);const L=tv.length();rc.set(a,tv.normalize());rc.far=L;return!rc.intersectObjects(walls).length&&!smk(a,b)}
function tracer(a,b,c){const l=new T.Line(new T.BufferGeometry().setFromPoints([a,b]),new T.LineBasicMaterial({color:c,transparent:true}));scene.add(l);tr.push({m:l,t:.12})}
function decal(h){const n=h.face.normal.clone().transformDirection(h.object.matrixWorld),m=new T.Mesh(new T.CircleGeometry(.09,8),new T.MeshBasicMaterial({color:0x111111,polygonOffset:true,polygonOffsetFactor:-2}));m.position.copy(h.point).addScaledVector(n,.01);m.lookAt(h.point.clone().add(n));scene.add(m);dec.push(m);if(dec.length>40)scene.remove(dec.shift())}
const bots=[0,1,2].map(i=>{const g=new T.Group(),b={g,n:'Bot '+(i+1),post:[[-20,-15],[20,-15],[0,-13]][i],hp:100,yaw:0,bl:0,al:0,bu:0,t2:0,cd:0,sp:0,df:0},
mk=(geo,y,z)=>{const m=new T.Mesh(geo,new T.MeshLambertMaterial({color:z=='h'?0xf0c8a0:0xd9384a}));m.position.y=y;m.castShadow=true;m.userData={z,b};g.add(m);return m};
b.parts=[mk(new T.BoxGeometry(.5,.8,.3),.4,'l'),mk(new T.BoxGeometry(.7,.8,.4),1.2,'b'),mk(new T.SphereGeometry(.22,12,8),1.75,'h')];
const gn=new T.Mesh(new T.BoxGeometry(.1,.12,.6),new T.MeshLambertMaterial({color:0x222222}));gn.position.set(.3,1.2,.35);g.add(gn);scene.add(g);return b});
function round(){S.ph='freeze';S.t=10;S.sp=0;S.pl=0;S.df=0;if(S.pd){own={classic:1};pri=0;cur='classic';P.ar=0}S.pd=0;
Object.assign(P,{x:0,y:0,z:27,vx:0,vz:0,vy:0,hp:100});yaw=pit=rp=ry=0;md=trig=0;rel=0;
for(const k in WP)AM[k]={m:WP[k].mag,r:WP[k].res};AB={E:1,Q:2,C:1};
bots.forEach((b,i)=>{b.hp=100;b.g.rotation.set(0,0,0);b.g.position.set(i*3-3,0,-27);b.yaw=0;b.bl=b.al=b.bu=b.cd=b.sp=b.df=0;b.rt=undefined});
[smokes,fires,gr].forEach(a=>{a.forEach(x=>scene.remove(x.m));a.length=0});spike.visible=false;
cam.position.set(0,1.65,27);msg('Buy phase: press B to shop',4)}
function end(win,r){if(S.ph!='act')return;S.ph='end';S.t=5;cr=Math.min(9000,cr+(win?3000:1900));S.sc[win?0:1]++;msg((win?'Round won':'Round lost')+'\n'+r)}
function hurt(d){const a=Math.min(P.ar,d);P.ar-=a;P.hp-=d-a;if(P.hp<=0&&!S.pd){P.hp=0;S.pd=1;md=trig=0;if(S.ph=='act'&&!S.sp)end(0,'You were eliminated');else msg('You died. The spike is live')}}
function dmgBot(b,d,z,wn){b.hp-=d;b.al=4;if(b.hp<=0){b.hp=0;b.g.rotation.x=-1.5;b.g.position.y=.35;cr=Math.min(9000,cr+200);feed('You ['+wn+'] '+(z=='h'?'headshot ':'')+b.n);snd(500,.15,.1);if(bots.every(x=>x.hp<=0))end(1,'Enemies eliminated')}}
function spread(){const w=WP[cur],v=Math.hypot(P.vx,P.vz);let b;if(w.sn)b=ads&&v<.8&&P.y<=0?.0004:.07;else b=w.sp*(ads?.6:1)*(1+4*Math.min(1,Math.max(0,(v-3.3)/2.7)))+(P.y>0?.05:0);return b+bloom}
function reload(){const w=WP[cur],a=AM[cur];if(rel>0||a.m>=w.mag||a.r<=0)return;rel=w.rl;snd(300,.1,.06)}
function sw(n){cur=n;rel=0;cd=.3;si=0}
function buy(i){const q=SH[i];if(cr<q[1])return snd(200);cr-=q[1];if(typeof q[2]=='string'){own[q[2]]=1;pri=q[2];AM[q[2]]={m:WP[q[2]].mag,r:WP[q[2]].res};sw(q[2])}else P.ar=q[2];snd(600,.1)}
function fire(){const w=WP[cur],a=AM[cur];if(S.pd||rel>0||cd>0)return;if(a.m<=0){reload();return}
trig=0;cd=w.rate;a.m--;ls=tm;const sp=spread(),d=V((R()-.5)*2*sp,(R()-.5)*2*sp,-1).normalize().applyQuaternion(cam.quaternion);
rp+=si<5?w.kp:w.kp*.1;ry+=si<2?0:w.ks*Math.sin(si*1.3);si++;bloom=Math.min(.03,bloom+w.bl);gk=.07;snd(w.sn?90:160,w.sn?.3:.09,.12,'sawtooth');
rc.set(cam.position,d);rc.far=300;
const h=rc.intersectObjects(walls.concat(...bots.filter(b=>b.hp>0).map(b=>b.parts)))[0];let e=cam.position.clone().addScaledVector(d,150);
if(h){e=h.point;const bo=h.object.userData.b;if(bo){const z=h.object.userData.z;dmgBot(bo,w.d[z],z,w.n);$('ch').style.setProperty('--c','#ff4655');setTimeout(()=>$('ch').style.setProperty('--c','#3fe8d5'),90)}else decal(h)}
tracer(cam.localToWorld(V(.22,-.2,-.9)),e,0xffe9a0)}
function smoke(p){const m=new T.Mesh(new T.SphereGeometry(1,32,24),SM(FSM,{t:{value:0},k:{value:0}},{transparent:true,depthWrite:false,side:T.DoubleSide}));m.position.copy(p);scene.add(m);smokes.push({m,p:m.position,r:4.2,t:12,a:0})}
function molly(p){const m=new T.Mesh(new T.CircleGeometry(3.5,32),SM(FSF,{t:{value:0}},{transparent:true,blending:T.AdditiveBlending,depthWrite:false}));m.rotation.x=-PI/2;m.position.set(p.x,.06,p.z);scene.add(m);fires.push({m,t:5,tk:0})}
function flashAt(p){snd(1400,.4,.15,'sine');const d=p.clone().sub(cam.position);if(!S.pd&&V(0,0,-1).applyQuaternion(cam.quaternion).angleTo(d)<1.396&&los(p,cam.position))flb=2.5;
bots.forEach(b=>{if(b.hp<=0)return;const o=V(b.g.position.x,1.6,b.g.position.z);if(V(Math.sin(b.yaw),0,Math.cos(b.yaw)).angleTo(p.clone().sub(o))<1.396&&los(p,o))b.bl=2.5})}
function thr(k){if(S.pd||S.ph=='end'||!AB[k])return;AB[k]--;const d=V(0,0,-1).applyQuaternion(cam.quaternion);
if(k=='E'){rc.set(cam.position,d);rc.far=45;const h=rc.intersectObjects(walls)[0],p=h?h.point.clone().addScaledVector(h.face.normal.clone().transformDirection(h.object.matrixWorld),1.5):cam.position.clone().addScaledVector(d,45);p.y=Math.max(p.y,2.2);smoke(p)}
else{const m=new T.Mesh(new T.SphereGeometry(.12,8,6),new T.MeshBasicMaterial({color:k=='Q'?0xffff66:0xff6622}));m.position.copy(cam.position).addScaledVector(d,.6);scene.add(m);gr.push({m,v:d.multiplyScalar(17).add(V(0,3,0)),t:0,ty:k})}}
function turn(b,t,dt){let d=t-b.yaw;d=Math.atan2(Math.sin(d),Math.cos(d));b.yaw+=d*Math.min(1,dt*8);b.g.rotation.y=b.yaw}
function go(b,tx,tz,s,dt){const p=b.g.position;if(p.z<-21.2&&tz>-21.2){tx=0;tz=-19.5}const dx=tx-p.x,dz=tz-p.z,L=Math.hypot(dx,dz);if(L<1)return 1;mv(p,dx/L*s*dt,dz/L*s*dt,.4);turn(b,Math.atan2(dx,dz),dt);return 0}
function shoot(b,o,e){const d=e.clone();d.y-=.5;d.sub(o).normalize();d.x+=(R()-.5)*.1;d.y+=(R()-.5)*.1;d.z+=(R()-.5)*.1;d.normalize();
rc.set(o,d);rc.far=90;const h=rc.intersectObjects(walls)[0],hd=h?h.distance:90,pt=V(0,0,0);let end=o.clone().addScaledVector(d,hd);
if(!S.pd&&new T.Ray(o,d).intersectSphere(new T.Sphere(V(P.x,P.y+1,P.z),.55),pt)&&pt.distanceTo(o)<hd&&!smk(o,pt)){end=pt;hurt(14)}
tracer(o.clone().addScaledVector(d,.5),end,0xff4040);b.sp=1;snd(200,.06,.04,'sawtooth')}
function ai(b,dt){if(b.hp<=0)return;b.df=0;b.bl-=dt;b.al-=dt;b.cd-=dt;b.sp-=dt;
const p=b.g.position,o=V(p.x,1.6,p.z),e=V(P.x,P.y+1.5,P.z),dv=e.clone().sub(o),dist=dv.length();
const see=!S.pd&&b.bl<=0&&dist<55&&(V(Math.sin(b.yaw),0,Math.cos(b.yaw)).angleTo(dv)<1.05||b.al>0)&&los(o,e);
if(see){b.rt=b.rt===undefined?.3+R()*.15:b.rt-dt;turn(b,Math.atan2(dv.x,dv.z),dt);if(b.rt<=0&&b.cd<=0&&b.bu<=0){b.bu=3;b.t2=0}}
else{b.rt=undefined;if(S.sp){const q=spike.position;if(Math.hypot(p.x-q.x,p.z-q.z)<1.8)b.df=1;else go(b,q.x,q.z,5,dt)}else if(go(b,b.post[0],b.post[1],3.5,dt))turn(b,0,dt)}
if(b.bl>0)b.bu=0;if(b.bu>0){b.t2-=dt;if(b.t2<=0){shoot(b,o,e);b.bu--;b.t2=.11;if(!b.bu)b.cd=.5+R()*.5}}
const bp=V(p.x,1.2,p.z);if(!S.pd&&V(0,0,-1).applyQuaternion(cam.quaternion).angleTo(bp.clone().sub(cam.position))<.9&&los(cam.position,bp))b.sp=1.2}
function hud(w,am){$('top').innerHTML=S.sc[0]+' : '+S.sc[1]+'<br><small>'+(S.ph=='freeze'?'Buy '+Math.ceil(S.t):S.sp?'Spike '+Math.max(0,S.sb).toFixed(1):Math.ceil(S.t))+'</small>';
$('st').textContent='HP '+Math.ceil(P.hp)+'   Shield '+P.ar;
$('wp').innerHTML=w.n+'<br>'+(rel>0?'Reloading':am.m+' / '+am.r)+'<br><small>$'+cr+'  E'+AB.E+' Q'+AB.Q+' C'+AB.C+'</small>';
$('buy').style.display=bq?'block':'none';if(bq)$('buy').innerHTML='Buy phase, $'+cr+'<br>'+SH.map((q,i)=>(i+5)+'  '+q[0]+'  $'+q[1]).join('<br>')+'<br>B closes';
$('fl').style.opacity=flb/2.5;const sn=ads&&w.sn&&!S.pd;$('sc').style.display=sn?'block':'none';$('ch').style.display=sn?'none':'block';gun.visible=!sn;
$('bar').style.display=S.pl>0?'block':'none';$('bar').firstChild.style.width=S.pl/4*100+'%';
const g=Math.min(60,5+spread()*800),c=$('ch').children;[[0,-g],[0,g],[-g,0],[g,0]].forEach((q,k)=>c[k].style.transform='translate('+q[0]+'px,'+q[1]+'px)'+(k>1?' rotate(90deg)':''))}
function radar(){const s=160/64,X=x=>(x+32)*s;mc.clearRect(0,0,160,160);mc.fillStyle='#8a8e99';B.forEach(b=>mc.fillRect(X(b.x-b.w/2),X(b.z-b.d/2),b.w*s,b.d*s));
mc.font='bold 11px sans-serif';sites.forEach((q,i)=>{mc.fillStyle='#f5b30166';mc.beginPath();mc.arc(X(q[0]),X(q[1]),5*s,0,7);mc.fill();mc.fillStyle='#ffd24a';mc.fillText('AB'[i],X(q[0])-4,X(q[1])+4)});
const px=X(P.x),pz=X(P.z),an=Math.atan2(-Math.cos(yaw),-Math.sin(yaw));mc.fillStyle='#ffffff44';mc.beginPath();mc.moveTo(px,pz);mc.arc(px,pz,48,an-.6,an+.6);mc.fill();
mc.fillStyle='#3fe8d5';mc.beginPath();mc.arc(px,pz,3.5,0,7);mc.fill();
mc.fillStyle='#ff4655';bots.forEach(b=>{if(b.hp>0&&b.sp>0){mc.beginPath();mc.arc(X(b.g.position.x),X(b.g.position.z),3.5,0,7);mc.fill()}});
if(S.sp){mc.fillStyle='#ff0';mc.fillRect(X(spike.position.x)-3,X(spike.position.z)-3,6,6)}}
function tick(dt){tm+=dt;cd-=dt;const w=WP[cur],am=AM[cur];
if(S.ph=='freeze'){S.t-=dt;if(S.t<=0){S.ph='act';S.t=100;msg('Go',1.2)}}else bq=0;
if(S.ph=='act'){
if(!S.sp){S.t-=dt;if(S.t<=0)end(0,'Time expired')}
else{S.sb-=dt;S.bt-=dt;if(S.bt<=0){snd(1000,.07,.12);S.bt=.07+.9*Math.pow(Math.max(0,S.sb)/45,2)}
S.df=bots.some(b=>b.hp>0&&b.df)?S.df+dt:S.df>=3.5?3.5:0;
if(S.df>=7)end(0,'Spike defused');else if(S.sb<=0){if(Math.hypot(P.x-spike.position.x,P.z-spike.position.z)<20){S.pd=1;P.hp=0}end(1,'Spike detonated')}}
bots.forEach(b=>ai(b,dt))}
else if(S.ph=='end'){S.t-=dt;if(S.t<=0){if(S.sc[0]>=5||S.sc[1]>=5){S.ph='over';msg((S.sc[0]>=5?'Victory':'Defeat')+'\nClick to play again')}else round()}}
bars.forEach(x=>x.m.visible=S.ph=='freeze');
const fw=(K.KeyW?1:0)-(K.KeyS?1:0),sd=(K.KeyD?1:0)-(K.KeyA?1:0),g0=P.y<=0,inZ=sites.some(q=>Math.hypot(P.x-q[0],P.z-q[1])<5),pl=S.ph=='act'&&!S.sp&&!S.pd&&K.Digit4&&inZ&&g0;
let wx=-Math.sin(yaw)*fw+Math.cos(yaw)*sd,wz=-Math.cos(yaw)*fw-Math.sin(yaw)*sd;const L=S.pd||pl?0:Math.hypot(wx,wz),spd=K.ShiftLeft||K.ShiftRight?3:6,v=Math.hypot(P.vx,P.vz);
if(g0){if(L){wx/=L;wz/=L;if(v>1.5&&wx*P.vx+wz*P.vz<-.3*v)P.vx=P.vz=0}
const ac=(L?55:40)*dt;P.vx=ap(P.vx,L?wx*spd:0,ac);P.vz=ap(P.vz,L?wz*spd:0,ac)}
if(pl){S.pl+=dt;if(S.pl>=4){S.sp=1;S.sb=45;S.bt=0;spike.position.set(P.x,.12,P.z);spike.visible=true;msg('Spike planted',2.5);snd(300,.4,.2)}}else S.pl=0;
const[mx,mz]=mv(P,P.vx*dt,P.vz*dt,.4);if(!mx)P.vx=0;if(!mz)P.vz=0;
if(K.Space&&g0&&!S.pd)P.vy=6.3;P.vy-=18*dt;P.y=Math.max(0,P.y+P.vy*dt);if(P.y==0&&P.vy<0)P.vy=0;
cam.position.set(P.x,S.pd?.4:P.y+1.65,P.z);cam.rotation.set(pit+rp,yaw+ry,0);
cam.fov+=((ads?w.zoom:75)-cam.fov)*Math.min(1,dt*14);cam.updateProjectionMatrix();
if(rel>0){rel-=dt;if(rel<=0){const n=Math.min(w.mag-am.m,am.r);am.m+=n;am.r-=n}}
if(md&&(w.auto||trig))fire();
if(tm-ls>.35){si=0;const k=Math.min(1,dt*10);rp-=rp*k;ry-=ry*k;bloom-=bloom*k}
gk-=gk*Math.min(1,dt*15);gun.position.z=-.55+gk;flb=Math.max(0,flb-dt);
smokes.forEach(s=>{s.t-=dt;s.a=Math.min(1,s.a+dt*2);s.m.scale.setScalar(s.r*s.a);const u=s.m.material.uniforms;u.t.value+=dt;u.k.value=Math.min(1,s.t,s.a*2)});
fires.forEach(f=>{f.t-=dt;f.tk-=dt;f.m.material.uniforms.t.value+=dt;if(f.tk<=0){f.tk=.5;const q=f.m.position;if(!S.pd&&P.y<1&&Math.hypot(P.x-q.x,P.z-q.z)<3.5)hurt(15);bots.forEach(b=>{if(b.hp>0&&Math.hypot(b.g.position.x-q.x,b.g.position.z-q.z)<3.5)dmgBot(b,15,'b','Molly')})}});
gr.forEach(g=>{g.t+=dt;g.v.y-=18*dt;const m=g.m.position,nx=m.x+g.v.x*dt,nz=m.z+g.v.z*dt;
if(blocked(nx,m.z,.1))g.v.x*=-.4;else m.x=nx;if(blocked(m.x,nz,.1))g.v.z*=-.4;else m.z=nz;
m.y+=g.v.y*dt;if(m.y<.12){m.y=.12;if(g.ty=='C'){molly(m);g.t=99}else{g.v.y*=-.4;g.v.x*=.7;g.v.z*=.7}}
if(g.ty=='Q'&&g.t>=1.2&&g.t<50){flashAt(m);g.t=99}});
tr.forEach(x=>{x.t-=dt;x.m.material.opacity=Math.max(0,x.t/.12)});
prune(tr,x=>x.t<=0);prune(smokes,x=>x.t<=0);prune(fires,x=>x.t<=0);prune(gr,x=>x.t>=50);
if(mt>0){mt-=dt;if(mt<=0)msg('')}
hud(w,am);radar()}
onkeydown=e=>{if(e.repeat)return;const c=e.code;K[c]=1;
if(c=='KeyR')reload();if(c=='Digit1'&&pri)sw(pri);if(c=='Digit2')sw('classic');
if(c=='KeyE')thr('E');if(c=='KeyQ')thr('Q');if(c=='KeyC')thr('C');
if(c=='KeyB'&&S.ph=='freeze')bq^=1;
if(bq&&c>='Digit5'&&c<='Digit8')buy(+c[5]-5);
if(c=='Space')e.preventDefault()};
onkeyup=e=>{K[e.code]=0};
onmousedown=e=>{if(!lock){const p=ren.domElement.requestPointerLock();if(p&&p.catch)p.catch(()=>{fb=lock=1;$('pz').style.display='none'});AC=AC||new(window.AudioContext||window.webkitAudioContext)();return}
if(S.ph=='over'){S.sc=[0,0];cr=800;S.pd=1;round();return}
if(e.button==0)md=trig=1;if(e.button==2)ads=1};
onmouseup=e=>{if(e.button==0)md=trig=0;if(e.button==2)ads=0};
oncontextmenu=e=>e.preventDefault();
onmousemove=e=>{if(!lock)return;const k=cam.fov/75*.0022;yaw-=e.movementX*k;pit=Math.max(-1.5,Math.min(1.5,pit-e.movementY*k))};
document.onpointerlockchange=()=>{lock=document.pointerLockElement==ren.domElement||fb;$('pz').style.display=lock?'none':'flex'};
document.onpointerlockerror=()=>{fb=lock=1;$('pz').style.display='none'};
onresize=()=>{ren.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()};
let last=performance.now();
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000);last=now;if(lock)tick(dt);ren.render(scene,cam)}
round();requestAnimationFrame(loop);
</script></body></html>
