<script>
'use strict';
/* CHANGELOG (search these tags): [SPAWN RATE] CFG anomalies/rampSecs | [SCALE] deep-room CFG + Leviathan size | [BOTTOMLESS] floorH
   [CEILING REMOVAL] makeChunk/buildChunk | [SLITHER] Leviathan.step/pose | [SURFACING] Leviathan.pose | [SHADER] LVM scaly skin
   [COLOSSUS] 2x Leviathan scale (CFG lev*, Leviathan.spawn/step) | [SNAKE SKIN] opaque Voronoi-scale serpent shader (LVM) */
/* ================= CONFIG - tweak these ================= */
const CFG={
 walkSpeed:2.6,    // m/s in shallow water
 sprintMult:1.45,  // Shift multiplier
 wadeDrag:3.0,     // accel/decel rate: LOWER = more sluggish wading
 depthSlow:0.3,    // extra slowdown per metre of water depth
 eyeHeight:1.6,    // eye height above the pool floor
 fogDensity:0.03,  // FogExp2 density (keep >= 0.025 so chunk pop-in stays hidden)
 fogColor:0xa9dcdc,
 waveSpeed:0.8,    // water ripple animation speed
 waveHeight:0.3,   // ripple strength (normal perturbation)
 godray:0.6,       // godray intensity (0 = off)
 sunTilt:0.5,      // slant of the light shafts
 viewChunks:2,     // load radius in chunks (2 => 5x5 chunks of 32 m)
 anomalies:2,      // [SPAWN RATE] max simultaneous anomalies (was 3); one more joins every rampSecs
 anomalySpeed:2.0, // m/s (player walks 2.6, sprints ~3.8)
 rampSecs:120, spawnMin:24, spawnMax:32, despawn:50, catchDist:0.9,
 bobAmp:0.035,     // head-bob height (m)
 stepLen:0.95,     // metres per footstep (bob + splash cycle)
 breathAmp:0.012,  // idle breathing sway
 strafeTilt:0.035, // view roll when strafing (rad)
  // --- [NEW] deep water / buoyancy / leviathan ---
 floatY:-0.2,       // body height while floating (water surface = 0)
 floatEye:0.55,     // camera lift above floatY (0 => eyes truly below the surface)
 swimMin:0.55,      // swim speed multiplier in deep water (0..1)
 deepMin:20,        // floor deeper than this (m) counts as a "deep room" that can host the leviathan
 deepSpacing:150,   // [SCALE] was 44 (~3.4x). [NEW] world is split into regions of this many cells (x4 m); each holds AT MOST ONE deep room. Keep >= 2*(deepRMax+2)
 deepChance:0.65,   // chance a region gets a deep room (1 = every region, lower = rarer)
 deepRMin:28, deepRMax:46, // [SCALE] was 8/13 (~3.5x): radius in cells (x4 m) => rooms ~224-368 m wide; centres are always >= 2*(deepRMax+2) cells (120 m) apart
 abyssDepth:1000,   // [BOTTOMLESS] floor depth (m) deep inside a basin (was ~43)
 abyssRamp:16,      // [BOTTOMLESS] cells from the cliff foot to full depth
 // ---- [COLOSSUS] Leviathan: 2x bigger. deepRMin / deepRMax / deepSpacing above are UNCHANGED, so the basins are exactly the same size.
 levSegs:144,       // [COLOSSUS] body segments: 72 -> 144 (2x) so the doubled body stays perfectly smooth (each segment is still ~6-10 m long)
 levLen:4.0,        // [COLOSSUS] leviathan length = pool width x this: 2.0 -> 4.0 (~900-1470 m, i.e. 3-4 pool diameters: it has to coil in the abyss)
 levGirth:0.028,    // [COLOSSUS] max body radius as a fraction of its length (unchanged fraction => girth also doubles: ~25-41 m radius)
 levSpeed:0.0048,   // [COLOSSUS] head speed in body-lengths/s (was .0065): a colossus moves slower, ~4-7 m/s, so one full surfacing wave spans the body
 levWave:0.02,      // [COLOSSUS] slither sway amplitude as a fraction of length (was a hard-coded .035): keeps the doubled body inside the basin
 levTurn:2.0,       // [COLOSSUS] min turning radius in body radii (was 3.5): the doubled body would otherwise swing out of the (unchanged) basin
 levBoost:2,        // [COLOSSUS] extra turn-rate the head gets near the edge of its patrol area (keeps the coils inside the basin)
 levPatrol:0.12,    // [COLOSSUS] head patrol radius as a fraction of the basin radius (was .3)
 levScales:128,     // [SNAKE SKIN] scales around the girth (high-frequency Voronoi cells; must be an integer so the pattern wraps seamlessly)
 levGlow:1,         // [SNAKE SKIN] wet specular sheen multiplier (0 = matte)
 anomalyFloor:-1.4, // humanoid anomalies float at this height instead of sinking into the abyss
 fov:75, mouseSens:0.0022, volume:0.8, reverb:0.9,
 seed:Math.random()*1e4|0
};
const C=4,N=8,CS=C*N,H=5; // cell size, cells per chunk side, chunk size, ceiling height

/* ================= PROCEDURAL WORLD FUNCTIONS ================= */
const hash=(x,z,s=0)=>{let h=Math.imul(x|0,374761393)+Math.imul(z|0,668265263)+Math.imul(CFG.seed+s,2246822519);h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296};
const vnoise=(x,z,s)=>{const xi=Math.floor(x),zi=Math.floor(z),fx=x-xi,fz=z-zi,u=fx*fx*(3-2*fx),v=fz*fz*(3-2*fz),a=hash(xi,zi,s),b=hash(xi+1,zi,s),c=hash(xi,zi+1,s),d=hash(xi+1,zi+1,s);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v};
// cell type: 0 open, 1 pillar, 2 wall. Regions: tight cells (P=3), rooms (P=5), pillared halls.
function cell(x,z){
 if(deepE(x,z)>-4)return 0; // [NEW] no walls/pillars in or around deep rooms
 const n=vnoise(x*.09,z*.09,7);
 if(n>.64)return((x|z)&1)?0:1;                       // big open hall, pillar every 8 m
 const P=n<.3?3:5,gx=((x%P)+P)%P,gz=((z%P)+P)%P;
 if(gx&&gz)return 0;                                  // room interior
 if(!gx&&!gz)return 2;                                // wall junction
 return hash(x,z,3)<.4?0:2;                           // wall line with doorways
}
// [NEW] DEEP ROOMS, ONE PER REGION: the map is tiled into CFG.deepSpacing-cell regions. Each region rolls deepChance and, on success,
// gets exactly one round basin whose centre is kept >= deepRMax+2 cells from the region edge -> basins never touch and no two
// deep rooms (or leviathans) ever exist within 2*(deepRMax+2) cells (~120 m) of each other. Deterministic, so no state to store.
function deepE(x,z){ // >0 inside a basin (cells from its rim), -99 if this region has none
 const S=CFG.deepSpacing,gx=Math.floor(x/S),gz=Math.floor(z/S);
 if(hash(gx,gz,31)>CFG.deepChance)return -99;
 const m=CFG.deepRMax+2,rr=CFG.deepRMin+hash(gx,gz,32)*(CFG.deepRMax-CFG.deepRMin);
 const cx=gx*S+m+hash(gx,gz,33)*(S-2*m),cz=gz*S+m+hash(gx,gz,34)*(S-2*m);
 return rr-Math.hypot(x-cx,z-cz)+(vnoise(x*.15,z*.15,35)-.5)*4} // +noise = organic, uneven rim
const deepT=(x,z)=>Math.min(1,Math.max(0,deepE(x,z)/4)); // 0 = normal floor, 1 = full abyss; /4 = cliff is ~4 cells wide (raise for a gentler slope)
// [BOTTOMLESS] same shore as before (0 -> -42 m over the 4-cell cliff), then a 2nd smoothstep drops it to -CFG.abyssDepth deeper inside the basin
const floorH=(x,z)=>{const e=deepE(x,z),t=Math.min(1,Math.max(0,e/4)),a=Math.min(1,Math.max(0,(e-4)/CFG.abyssRamp));
 return -.2-Math.floor(vnoise(x*.08,z*.08,11)*4)*.3-t*t*(3-2*t)*42-a*a*(3-2*a)*(CFG.abyssDepth-42)};
function blocked(x,z,r){
 for(let i=0;i<4;i++){const X=x+(i&1?r:-r),Z=z+(i&2?r:-r),cx=Math.floor(X/C),cz=Math.floor(Z/C),t=cell(cx,cz);
  if(t==2)return true;
  if(t==1&&Math.abs(X-(cx+.5)*C)<.6&&Math.abs(Z-(cz+.5)*C)<.6)return true}
 return false}

/* ================= PROCEDURAL TEXTURES ================= */
function tileTex(){ // seamless 4x4 ceramic tiles (1 m each), grout wraps cleanly
 const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d');
 x.fillStyle='#9fb5b3';x.fillRect(0,0,256,256);
 for(let j=0;j<4;j++)for(let i=0;i<4;i++){
  const g=x.createLinearGradient(i*64,j*64,i*64+64,j*64+64),b=236+Math.random()*10|0;
  g.addColorStop(0,`rgb(${b+6},${b+8},${b+4})`);g.addColorStop(1,`rgb(${b-14},${b-8},${b-8})`);
  x.fillStyle=g;x.fillRect(i*64+2,j*64+2,60,60)}
 for(let i=0;i<1500;i++){x.fillStyle=`rgba(90,120,120,${Math.random()*.08})`;x.fillRect(Math.random()*256,Math.random()*256,1.5,1.5)}
 const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=8;return t}
function ceilTex(){ // one chunk-sized ceiling with a round skylight (oculus) in the middle
 const c=document.createElement('canvas');c.width=c.height=512;const x=c.getContext('2d');
 x.fillStyle='#c4d4d2';x.fillRect(0,0,512,512);x.strokeStyle='#9db0ae';x.lineWidth=2;
 for(let i=0;i<=512;i+=32){x.beginPath();x.moveTo(i,0);x.lineTo(i,512);x.moveTo(0,i);x.lineTo(512,i);x.stroke()}
 x.fillStyle='#8aa09e';x.beginPath();x.arc(256,256,88,0,7);x.fill();
 x.fillStyle='#fff';x.beginPath();x.arc(256,256,80,0,7);x.fill();
 const t=new THREE.CanvasTexture(c);t.anisotropy=4;return t}

/* ================= SCENE ================= */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);
document.body.prepend(renderer.domElement);const cv=renderer.domElement;
const scene=new THREE.Scene();scene.background=new THREE.Color(CFG.fogColor);scene.fog=new THREE.FogExp2(CFG.fogColor,CFG.fogDensity);
const camera=new THREE.PerspectiveCamera(CFG.fov,innerWidth/innerHeight,.1,1400) /* [COLOSSUS] far 500->1400 so the 2x colossus is never clipped */;camera.rotation.order='YXZ';
scene.add(new THREE.HemisphereLight(0xffffff,0x99cccc,.95));
const SUN=new THREE.Vector3(-CFG.sunTilt,1,0).normalize();
const sunL=new THREE.DirectionalLight(0xfff2d8,.55);sunL.position.copy(SUN);scene.add(sunL);
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()});

// box geometry whose UVs are in metres, so tiles stay square on every face
function box(w,h,d){const g=new THREE.BoxGeometry(w,h,d),u=g.attributes.uv,s=[[d,h],[d,h],[w,d],[w,d],[w,h],[w,h]];
 for(let i=0;i<24;i++){const[a,b]=s[i>>2];u.setXY(i,u.getX(i)*a/4,u.getY(i)*b/4)}return g}
const FH=48,floorGeo=box(C,FH,C),wallGeo=box(C,9,C),pilGeo=box(1.2,9,1.2);
const tileMat=new THREE.MeshLambertMaterial({map:tileTex()});
const ceilMat=new THREE.MeshBasicMaterial({map:ceilTex()});
const ceilGeo=new THREE.PlaneGeometry(CS,CS);ceilGeo.rotateX(Math.PI/2);
const waterGeo=new THREE.PlaneGeometry(CS,CS,N,N);waterGeo.rotateX(-Math.PI/2);
// godray shaft: open cylinder, sheared along the sun direction
const rayGeo=new THREE.CylinderGeometry(5,5,6,20,1,true);rayGeo.translate(0,2,0);
{const p=rayGeo.attributes.position;for(let i=0;i<p.count;i++)p.setX(i,p.getX(i)+(5-p.getY(i))*CFG.sunTilt)}

/* ================= WATER SHADER ================= */
const SNOISE=`vec3 m289(vec3 x){return x-floor(x*(1./289.))*289.;}vec2 m289(vec2 x){return x-floor(x*(1./289.))*289.;}
vec3 perm(vec3 x){return m289(((x*34.)+1.)*x);}
float snoise(vec2 v){const vec4 C=vec4(.211324865405187,.366025403784439,-.577350269189626,.024390243902439);
vec2 i=floor(v+dot(v,C.yy));vec2 x0=v-i+dot(i,C.xx);vec2 i1=(x0.x>x0.y)?vec2(1.,0.):vec2(0.,1.);
vec4 x12=x0.xyxy+C.xxzz;x12.xy-=i1;i=m289(i);
vec3 p=perm(perm(i.y+vec3(0.,i1.y,1.))+i.x+vec3(0.,i1.x,1.));
vec3 m=max(.5-vec3(dot(x0,x0),dot(x12.xy,x12.xy),dot(x12.zw,x12.zw)),0.);m=m*m;m=m*m;
vec3 x=2.*fract(p*C.www)-1.;vec3 h=abs(x)-.5;vec3 ox=floor(x+.5);vec3 a0=x-ox;
m*=1.79284291400159-.85373472095314*(a0*a0+h*h);
vec3 g;g.x=a0.x*x0.x+h.x*x0.y;g.yz=a0.yz*x12.xz+h.yz*x12.yw;return 130.*dot(m,g);}`;
const fogU=()=>({uFogC:{value:new THREE.Color(CFG.fogColor)},uFogD:{value:CFG.fogDensity}});
const W=new THREE.ShaderMaterial({transparent:true,depthWrite:false,side:THREE.DoubleSide,
 uniforms:Object.assign(fogU(),{uTime:{value:0},uSpd:{value:CFG.waveSpeed},uRip:{value:CFG.waveHeight},uSun:{value:SUN}}),
 vertexShader:`attribute float aDepth;varying vec3 vW;varying float vD;
 void main(){vec4 w=modelMatrix*vec4(position,1.);vW=w.xyz;vD=aDepth;gl_Position=projectionMatrix*viewMatrix*w;}`,
 fragmentShader:`uniform float uTime,uSpd,uRip,uFogD;uniform vec3 uFogC,uSun;varying vec3 vW;varying float vD;`+SNOISE+`
 // animated 2-octave simplex height field -> ripples
 float wh(vec2 p){float t=uTime*uSpd;return snoise(p*.55+vec2(t*.35,t*.2))*.6+snoise(p*1.7-vec2(t*.5,-t*.3))*.25;}
 void main(){
  vec3 dv=cameraPosition-vW;float d=length(dv);vec3 V=dv/d;vec2 p=vW.xz;float e=.1,h0=wh(p);
  float lod=1.-smoothstep(25.,60.,d);                       // fade ripples with distance (perf + less shimmer)
  vec3 n=normalize(vec3((h0-wh(p+vec2(e,0.)))/e*uRip*lod,1.,(h0-wh(p+vec2(0.,e)))/e*uRip*lod));
  float dep=smoothstep(0.,1.2,vD),ab=smoothstep(1.5,30.,vD); /*[NEW] ab = abyss factor: 0 shallow .. 1 at 30 m+*/                          // 0 = shallow, 1 = deep
  float c=pow(max(1.-abs(snoise(p*1.3+n.xz*vD*3.+uTime*uSpd*.3)),0.),6.)*(1.-dep)*.5; // caustics through the refracting surface
  vec3 body=mix(mix(vec3(.45,.92,.93),vec3(.02,.27,.33),dep)+c,vec3(0.),ab); /*[NEW] extreme depth -> black void*/ // light cyan -> dark teal by depth
  vec3 R=reflect(-V,n);
  vec3 sky=mix(vec3(.6,.85,.87),vec3(1.,.97,.9),smoothstep(0.,1.,R.y));
  float F=.05+.95*pow(1.-max(dot(n,V),0.),4.);               // fresnel: reflection vs. see-through
  vec3 col=mix(body,sky,F)+pow(max(dot(R,uSun),0.),90.)*.8;  // + sun glint
  float a=mix(clamp(mix(.28,.86,dep)+F*.5,0.,1.),1.,ab);
  float fg=(1.-exp(-uFogD*uFogD*d*d))*(1.-.85*ab*(1.-smoothstep(45.,70.,d))); /*[NEW] abyss resists fog so it stays black from afar (fog wins past 70 m to hide chunk edges)*/
  gl_FragColor=vec4(mix(col,uFogC,fg),a);}`});
const R=new THREE.ShaderMaterial({transparent:true,depthWrite:false,side:THREE.DoubleSide,blending:THREE.AdditiveBlending,
 uniforms:Object.assign(fogU(),{uTime:{value:0},uI:{value:CFG.godray*.35}}),
 vertexShader:`varying vec3 vN,vMV,vP;varying float vH;
 void main(){vN=normalize(normalMatrix*normal);vec4 m=modelViewMatrix*vec4(position,1.);vMV=m.xyz;vP=position;vH=clamp((position.y+1.)/6.,0.,1.);gl_Position=projectionMatrix*m;}`,
 fragmentShader:`uniform float uTime,uI,uFogD;uniform vec3 uFogC;varying vec3 vN,vMV,vP;varying float vH;
 void main(){float d=length(vMV);float ndv=abs(dot(normalize(vN),-vMV/d)); // soft silhouette edges
  float streak=.75+.25*sin(atan(vP.z,vP.x)*9.+vP.y*.4+uTime*.25);
  float a=uI*pow(ndv,1.5)*(.15+.85*smoothstep(0.,1.,vH))*streak*smoothstep(.4,4.,d)*exp(-uFogD*uFogD*d*d);
  gl_FragColor=vec4(1.,.95,.8,a);}`});

/* ================= CHUNKS (pooled: no allocation or GPU churn while streaming) ================= */
const chunks=new Map(),pool=[],D=new THREE.Object3D();
function makeChunk(){
 const g=new THREE.Group(),im=(geo)=>{const m=new THREE.InstancedMesh(geo,tileMat,N*N);m.instanceMatrix.setUsage(THREE.DynamicDrawUsage);m.frustumCulled=false;g.add(m);return m};
 const ch={g,floor:im(floorGeo),walls:im(wallGeo),pil:im(pilGeo)};
 const wg=waterGeo.clone();wg.setAttribute('aDepth',new THREE.BufferAttribute(new Float32Array((N+1)*(N+1)),1));
 ch.water=new THREE.Mesh(wg,W);ch.water.position.set(CS/2,0,CS/2);ch.water.renderOrder=1;
 const ce=new THREE.Mesh(ceilGeo,ceilMat);ce.position.set(CS/2,H,CS/2);
 const ry=new THREE.Mesh(rayGeo,R);ry.position.set(CS/2,0,CS/2);ry.renderOrder=2;
 g.add(ch.water,ce,ry);ch.ce=ce;ch.ry=ry;g.visible=false;scene.add(g);return ch}
function buildChunk(ch,cx,cz){
 ch.cx=cx;ch.cz=cz;const ox=cx*N,oz=cz*N;let nw=0,np=0,dp=false; // dp = chunk touches a deep room
 ch.g.position.set(cx*CS,0,cz*CS);
 for(let j=0;j<N;j++)for(let i=0;i<N;i++){
  const x=ox+i,z=oz+j,t=cell(x,z),px=i*C+C/2,pz=j*C+C/2;if(!dp)dp=deepE(x,z)>-4;
  D.position.set(px,floorH(x,z)-FH/2,pz);D.updateMatrix();ch.floor.setMatrixAt(j*N+i,D.matrix);
  if(t){D.position.set(px,.5,pz);D.updateMatrix();(t==2?ch.walls:ch.pil).setMatrixAt(t==2?nw++:np++,D.matrix)}}
 ch.walls.count=nw;ch.pil.count=np;ch.floor.instanceMatrix.needsUpdate=ch.walls.instanceMatrix.needsUpdate=ch.pil.instanceMatrix.needsUpdate=true;
 // [CEILING REMOVAL] chunks inside/overlapping a deep room (same zone where walls are removed) lose the ceiling and its godray shaft -> open foggy void
 ch.ce.visible=ch.ry.visible=!dp;
 const a=ch.water.geometry.attributes.aDepth; // water depth per vertex = average of the 4 surrounding floor cells
 for(let j=0;j<=N;j++)for(let i=0;i<=N;i++){let s=0;for(let k=0;k<4;k++)s+=floorH(ox+i-(k&1),oz+j-(k>>1));a.array[j*(N+1)+i]=Math.min(64,-s/4)} // [BOTTOMLESS] clamp: shader is fully black past 30 m
 a.needsUpdate=true;ch.g.visible=true}
for(let i=0;i<(2*CFG.viewChunks+1)**2;i++)pool.push(makeChunk());
function updateChunks(px,pz,budget){ // recycle far chunks, build near ones (nearest first, `budget` per call)
 const cx=Math.floor(px/CS),cz=Math.floor(pz/CS),Rr=CFG.viewChunks;
 for(const[k,ch]of chunks)if(Math.abs(ch.cx-cx)>Rr||Math.abs(ch.cz-cz)>Rr){ch.g.visible=false;pool.push(ch);chunks.delete(k)}
 for(let r=0;r<=Rr;r++)for(let dz=-r;dz<=r;dz++)for(let dx=-r;dx<=r;dx++){
  if(Math.max(Math.abs(dx),Math.abs(dz))!=r)continue;const k=(cx+dx)+','+(cz+dz);
  if(chunks.has(k)||!pool.length||budget<=0)continue;const ch=pool.pop();buildChunk(ch,cx+dx,cz+dz);chunks.set(k,ch);budget--}}

/* ================= ANOMALIES ================= */
const anMat=new THREE.MeshBasicMaterial({color:0x020405});
const AG={leg:new THREE.CylinderGeometry(.12,.2,1.2,8),tor:new THREE.CylinderGeometry(.2,.26,1,8),head:new THREE.SphereGeometry(.19,10,8),arm:new THREE.CylinderGeometry(.045,.035,1.5,6)};
AG.arm.translate(0,-.75,0);
const ans=[];
for(let i=0;i<CFG.anomalies;i++){ // dark, featureless, long-armed figures
 const g=new THREE.Group(),m=(geo,y)=>{const o=new THREE.Mesh(geo,anMat);o.position.y=y;g.add(o);return o};
 m(AG.leg,.6);m(AG.tor,1.7);const hd=m(AG.head,2.45);hd.scale.y=1.35;

ov.onclick=(e)=>{
  if(e.target&&e.target.closest('#poolBackBtn'))return;
  if(!AC)initAudio();AC.resume();started=true;paused=false;ov.style.display='none';
  try{Promise.resolve(cv.requestPointerLock()).catch(()=>fallback=true)}catch(err){fallback=true}
};

/* ================= MAIN LOOP ================= */
function update(dt){
 T+=dt;hitCool-=dt;
 const fw=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0),st=(keys.KeyD?1:0)-(keys.KeyA?1:0),sn=Math.sin(yaw),cs=Math.cos(yaw);
 let wx=-sn*fw+cs*st,wz=-cs*fw-sn*st;const wl=Math.hypot(wx,wz);if(wl>1){wx/=wl;wz/=wl}
 const cx=Math.floor(P.x/C),cz=Math.floor(P.z/C),fh=floorH(cx,cz),depth=-fh;
 const sp=CFG.walkSpeed*((keys.ShiftLeft||keys.ShiftRight)?CFG.sprintMult:1)*Math.max(CFG.swimMin,1-depth*CFG.depthSlow);
 const k=1-Math.exp(-CFG.wadeDrag*dt);vx+=(wx*sp-vx)*k;vz+=(wz*sp-vz)*k; // sluggish water inertia
 const nx=P.x+vx*dt;if(!blocked(nx,P.z,.35))P.x=nx;else vx=0;
 const nz=P.z+vz*dt;if(!blocked(P.x,nz,.35))P.z=nz;else vz=0;
 updateChunks(P.x,P.z,2);
 // head bob, breathing, strafe tilt
 const spd=Math.hypot(vx,vz),mv=Math.min(1,spd/1.2);bobPh+=spd*dt*Math.PI/CFG.stepLen;
 const sid=Math.floor((bobPh+Math.PI/4)/Math.PI);if(sid!=lastStep){lastStep=sid;if(spd>.4)splash(Math.min(1,spd/CFG.walkSpeed)*(1-.5*fk))}
 const bob=Math.sin(bobPh*2)*CFG.bobAmp*mv,sway=Math.cos(bobPh)*CFG.bobAmp*.6*mv,br=Math.sin(T*1.4)*(1-mv);
 // [NEW] BUOYANCY: eye = the higher of "standing on the floor" and "floating at the surface".
 // Floor drops away -> eye holds at floatY+floatEye (fk -> 1 = swimming); floor rises -> you smoothly wade back out.
 const stand=fh+CFG.eyeHeight,surf=CFG.floatY+CFG.floatEye;fk+=((stand<surf?1:0)-fk)*Math.min(1,dt*3);
 tilt+=(-st*CFG.strafeTilt-tilt)*Math.min(1,dt*6);eyeY+=(Math.max(stand,surf)-eyeY)*Math.min(1,dt*6);
 camera.position.set(P.x+cs*sway,eyeY+bob*(1-fk)+br*CFG.breathAmp+fk*Math.sin(T*1.1)*.06,P.z-sn*sway); // [NEW] slow swell replaces footstep bob while floating
 camera.rotation.set(pitch+br*.004,yaw,tilt+br*.002+fk*Math.sin(T*.7)*.012);
 // anomalies
 let near=99;
 ans.forEach((a,i)=>{
  if(!a.on){if(T>3+i*CFG.rampSecs){a.on=a.g.visible=true;respawn(a)}return}
  const dx=P.x-a.g.position.x,dz=P.z-a.g.position.z,d=Math.hypot(dx,dz);
  if(d>CFG.despawn){respawn(a);return}
  const s=CFG.anomalySpeed*dt/d;a.g.position.x+=dx*s;a.g.position.z+=dz*s;a.g.rotation.y=Math.atan2(dx,dz); // silent, relentless
  a.y+=(Math.max(CFG.anomalyFloor,floorH(Math.floor(a.g.position.x/C),Math.floor(a.g.position.z/C)))-a.y)*Math.min(1,dt*5);
  a.ph+=dt*3;a.g.position.y=a.y+Math.sin(a.ph*2)*.04;
  a.arms[0].rotation.x=Math.sin(a.ph)*.35;a.arms[1].rotation.x=-Math.sin(a.ph)*.35;a.hd.rotation.z=Math.sin(a.ph*.5)*.25;
  near=Math.min(near,d);if(d<CFG.catchDist)caught()});
 const danger=Math.max(0,1-near/18);
 // [NEW] leviathan patrol + abyss drone (swells with water depth under you and with leviathan proximity)
 lev.update(dt,P.x,P.z);LVM.uniforms.uTime.value=T;
 const lp=lev.on?Math.max(0,1-lev.dist/lev.prox)*fk /* [SCALE] proximity = distance to nearest body segment */:0;
 if(abyss)abyss.gain.setTargetAtTime(fk*(.06+.3*Math.min(1,depth/40))+lp*.25,AC.currentTime,.5);
 vig.style.opacity=Math.max(danger*.9,lp*.6);
 if(dread)dread.gain.setTargetAtTime(danger*.25,AC.currentTime,.3);
 W.uniforms.uTime.value=R.uniforms.uTime.value=T;
 const sec=T|0;if(sec!=lastSec){lastSec=sec;hud.textContent=`survived ${String(sec/60|0).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}   caught ${catches}`}}
teleport();camera.position.set(P.x,eyeY,P.z);camera.rotation.y=yaw;
let last=performance.now();
(function frame(now){requestAnimationFrame(frame);const dt=Math.min((now-last)/1000,.05);last=now;
 if(started&&!paused)update(dt);renderer.render(scene,camera)})(last);
</script></body></html>
